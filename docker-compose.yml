version: "3.3"

services:
  laser-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    
    image: laser-scanner67:latest
    container_name: laser-scanner

    network_mode: host

    environment:
      DISPLAY: "${DISPLAY}"

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    stdin_open: true
    tty: true
    restart: "no"