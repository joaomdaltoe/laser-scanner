version: "3.3"

services:
  laser-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    
    image: labsolda:labsolda-laser-scanner
    container_name: laser-scanner
    # Usa a identidade da sessao grafica do host. Isso tambem permite que o Qt
    # autentique no barramento AT-SPI anunciado pelo servidor X11.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    network_mode: host

    cap_add:
      - SYS_PTRACE

    security_opt:
      - seccomp:unconfined

    environment:
      DISPLAY: "${DISPLAY}"
      HOME: /host-home
      LASER_SCANNER_EXPORT_DIR: /host-home
      TZ: America/Sao_Paulo
      XDG_RUNTIME_DIR: /tmp/laser-scanner-runtime
      # O libdbus 1.12 nao deve encerrar o processo por uma falha interna da
      # ponte AT-SPI do Qt 5.9. O aviso permanece visivel para diagnostico.
      DBUS_FATAL_WARNINGS: "0"

      # Configuracao MQTT. Altere estes valores sem recompilar a aplicacao.
      MQTT_HOST: "192.168.0.5"
      MQTT_PORT: "1883"
      MQTT_TOPIC_PREFIX: "laser-lab"
      MQTT_CLIENT_ID: "laser-scanner"
      MQTT_KEEPALIVE_SECONDS: "60"

      # RATE DO TOPICO: 1000 ms = uma publicacao por segundo.
      # Para mudar a frequencia futuramente, altere somente este valor.
      MQTT_PUBLISH_INTERVAL_MS: "100"

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Usa diretamente a HOME da sessao que iniciou o Compose. Esta sintaxe e
      # compativel com o docker-compose fornecido pelo Ubuntu 18.04.
      - "${HOME}:/host-home:rw"

    stdin_open: true
    tty: true
    restart: "no"
